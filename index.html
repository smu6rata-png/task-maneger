<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{

.ok .sync-dot{background:#1D9E75}
.err .sync-dot{background:#E24B4A}
.loading .sync-dot{background:#EF9F27;animation:pulse 1s infinite}
.warn .sync-dot{background:#EF9F27}

/* header */
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;flex-wrap:wrap;gap:.5rem}

/* card / form */

.add-row:last-child{margin-bottom:0}

<script>
// ================================================================
// VERSION — アップデート時にここを更新
// ================================================================
const APP_VERSION = "1.1.0";

// ================================================================
// SUPABASE HELPERS
// ================================================================
const isReady = () =>
  SUPABASE_URL !== "YOUR_SUPABASE_URL" && SUPABASE_ANON_KEY !== "YOUR_SUPABASE_ANON_KEY";

async function sbFetch(path, opts = {}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: {
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
      "Content-Type": "application/json",
      "Prefer": opts.prefer || "",
      ...opts.headers,
    },
    ...opts,
  });
  if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

// ================================================================
// SYNC STATUS
// ================================================================
function setSS(state, msg) {
  const b = document.getElementById("sync-bar");
  b.className = state;
  document.getElementById("sync-msg").textContent = msg;
}

// ================================================================
// CLOUD OPS
// ================================================================
async function syncFromCloud() {
  if (!isReady()) { setSS("warn","⚠️ Supabase未設定 — ローカル保存モード"); return; }
  setSS("loading","クラウドと同期中...");
  try {
    const data = await sbFetch(`${TABLE_NAME}?order=created_at.asc`);
    tasks = data.map(dbToLocal);
    saveLocal(); render(); buildGF();
    setSS("ok",`✓ 同期完了 — ${new Date().toLocaleTimeString("ja-JP")}`);
  } catch(e) { setSS("err",`✗ 同期失敗: ${e.message}`); }
}

async function cloudInsert(t) {
  if (!isReady()) return;
  try { await sbFetch(TABLE_NAME,{method:"POST",prefer:"return=minimal",body:JSON.stringify(localToDb(t))}); }
  catch(e) { setSS("err",`✗ 保存失敗: ${e.message}`); }
}

async function cloudUpdate(t) {
  if (!isReady()) return;
  try { await sbFetch(`${TABLE_NAME}?id=eq.${t.id}`,{method:"PATCH",prefer:"return=minimal",body:JSON.stringify(localToDb(t))}); }
  catch(e) { setSS("err",`✗ 更新失敗: ${e.message}`); }
}

async function cloudDelete(id) {
  if (!isReady()) return;
  try { await sbFetch(`${TABLE_NAME}?id=eq.${id}`,{method:"DELETE"}); }
  catch(e) { setSS("err",`✗ 削除失敗: ${e.message}`); }
}

// ================================================================
// DATA MAPPING
// ================================================================
const localToDb = t => ({
  id: t.id, title: t.title, genre: t.genre, priority: t.priority, cost: t.cost,
  due: t.due||null, time: t.time||null, done: t.done, repeat: t.repeat,
  repeat_day: t.repeatDay??null, repeat_time: t.repeatTime||null,
});

const dbToLocal = r => ({
  id: r.id, title: r.title, genre: r.genre, priority: r.priority, cost: r.cost,
  due: r.due||"", time: r.time||"", done: r.done, repeat: r.repeat,
  repeatDay: r.repeat_day??undefined, repeatTime: r.repeat_time||"",
});

// ================================================================
// LOCAL STORAGE
// ================================================================
const LOCAL_KEY = "taskapp-v2";
const saveLocal = () => { try{localStorage.setItem(LOCAL_KEY,JSON.stringify(tasks));}catch(e){} };
const loadLocal = () => { try{const r=localStorage.getItem(LOCAL_KEY);if(r)tasks=JSON.parse(r);}catch(e){} };

// ================================================================
// CONSTANTS
// ================================================================
const GC = {
  '課題':{dot:'#378ADD',bar:'#378ADD',bg:'#E6F1FB',tx:'#185FA5'},
  '趣味':{dot:'#D4537E',bar:'#D4537E',bg:'#FBEAF0',tx:'#993556'},
  '就活':{dot:'#7F77DD',bar:'#7F77DD',bg:'#EEEDFE',tx:'#534AB7'},
  'サークル':{dot:'#1D9E75',bar:'#1D9E75',bg:'#E1F5EE',tx:'#0F6E56'},
  '交友':{dot:'#EF9F27',bar:'#EF9F27',bg:'#FAEEDA',tx:'#854F0B'},
  '家事':{dot:'#D85A30',bar:'#D85A30',bg:'#FAECE7',tx:'#993C1D'},
  'アルバイト':{dot:'#E24B4A',bar:'#E24B4A',bg:'#FCEBEB',tx:'#A32D2D'},
  'その他':{dot:'#888780',bar:'#888780',bg:'#F1EFE8',tx:'#5F5E5A'},
};
const GENRES = Object.keys(GC);
const DAYS = ['日','月','火','水','木','金','土'];
const PL = {high:'優先度：高',medium:'優先度：普通',low:'優先度：低'};
const CL = {light:'軽い',medium:'普通',heavy:'重い'};

let tasks=[], gf='all', sf='all', editId=null, pendingId=null;

// ================================================================
// DATE UTILS
// ================================================================
const today = () => new Date().toISOString().split('T')[0];
const isOv  = t => !t.done && t.due && t.due < today();
const fmtD  = (due,time) => { if(!due)return''; const[,m,d]=due.split('-'); return time?`${m}/${d} ${time}`:`${m}/${d}`; };
const nthWD = (dow,n=1)  => {
  const d=new Date(); let diff=dow-d.getDay(); if(diff<=0)diff+=7; diff+=(n-1)*7;
  d.setDate(d.getDate()+diff); return d.toISOString().split('T')[0];
};
const newId = () => typeof crypto!=='undefined'&&crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`;

// ================================================================
// FORM
// ================================================================
function toggleRepeatForm(on) {
  document.getElementById('repeat-opts').classList.toggle('show',on);
  document.getElementById('due-row').style.display    = on?'none':'flex';
  document.getElementById('rep-add-row').style.display = on?'flex':'none';
}

async function addTask() {
  const inp=document.getElementById('new-task'), title=inp.value.trim();
  if(!title)return;
  const isRep=document.getElementById('repeat-chk').checked;
  const rd=parseInt(document.getElementById('repeat-day').value);
  const rt=document.getElementById('repeat-time').value;
  const t={id:newId(),title,done:false,repeat:isRep,
    genre:document.getElementById('new-genre').value,
    priority:document.getElementById('new-priority').value,
    cost:document.getElementById('new-cost').value};
  if(isRep){t.repeatDay=rd;t.repeatTime=rt;t.due=nthWD(rd,1);t.time=rt;}
  else{t.due=document.getElementById('new-due').value;t.time=document.getElementById('new-time').value;}
  tasks.push(t); inp.value='';
  document.getElementById('repeat-chk').checked=false; toggleRepeatForm(false);
  saveLocal();render();buildGF();
  await cloudInsert(t);
  setSS("ok",`✓ 保存完了 — ${new Date().toLocaleTimeString("ja-JP")}`);
}

// ================================================================
// DIALOG
// ================================================================
function openDialog(id){
  const t=tasks.find(x=>x.id===id); if(!t)return;
  pendingId=id;
  const nd=nthWD(t.repeatDay,1), nnd=nthWD(t.repeatDay,2);
  document.getElementById('dlg-title').textContent=`「${t.title}」を完了`;
  document.getElementById('dlg-sub').textContent=`週次リピートタスクです。来週（${fmtD(nd,t.repeatTime)}）の扱いを選んでください。`;
  document.getElementById('custom-area').style.display='none';
  document.getElementById('custom-due').value=nd;
  document.getElementById('custom-time').value=t.repeatTime||'23:59';
  const choices=[
    {icon:'🔁',bg:'#E1F5EE',col:'#0F6E56',label:'来週も通常通り追加',desc:`${fmtD(nd,t.repeatTime)} に同じタスクを追加`,fn:async()=>{await spawnNext(t);commit();}},
    {icon:'🚫',bg:'#FAEEDA',col:'#854F0B',label:'来週だけスキップ',desc:`来週はなし。再来週（${fmtD(nnd,t.repeatTime)}）から再開`,fn:async()=>{await spawnNext(t,null,null,2);commit();}},
    {icon:'🕐',bg:'#EEEDFE',col:'#534AB7',label:'来週だけ期限を変更',desc:'来週のみ別の日時。再来週以降は通常に戻る',fn:()=>{document.getElementById('custom-area').style.display='block';}},
    {icon:'⏹',bg:'#FCEBEB',col:'#A32D2D',label:'リピートを終了',desc:'今後このタスクは繰り返さない',fn:()=>{commit();}},
  ];
  document.getElementById('dlg-choices').innerHTML=choices.map((c,i)=>`
    <button class="choice-btn" id="ch${i}">
      <span class="choice-icon" style="background:${c.bg};color:${c.col}">${c.icon}</span>
      <span><div class="choice-label">${c.label}</div><div class="choice-desc">${c.desc}</div></span>
    </button>`).join('');
  choices.forEach((c,i)=>document.getElementById('ch'+i).addEventListener('click',c.fn));
  const dw=document.getElementById('dialog-wrap');
  dw.classList.add('show');
  dw.scrollIntoView({behavior:'smooth',block:'start'});
}

async function spawnNext(t,due,time,weeks=1){
  const nt={id:newId(),title:t.title,genre:t.genre,priority:t.priority,cost:t.cost,
    due:due||nthWD(t.repeatDay,weeks),
    time:time!==undefined?time:(t.repeatTime||''),
    done:false,repeat:true,repeatDay:t.repeatDay,repeatTime:t.repeatTime};
  tasks.push(nt);
  await cloudInsert(nt);
}

function commit(){
  pendingId=null;
  document.getElementById('dialog-wrap').classList.remove('show');
  saveLocal();render();buildGF();
  setSS("ok",`✓ 保存完了 — ${new Date().toLocaleTimeString("ja-JP")}`);
}

async function applyCustom(){
  const t=tasks.find(x=>x.id===pendingId); if(!t)return;
  await spawnNext(t,document.getElementById('custom-due').value,document.getElementById('custom-time').value);
  await spawnNext(t,null,null,2);
  commit();
}

function cancelDialog(){
  const t=tasks.find(x=>x.id===pendingId);
  if(t){t.done=false;cloudUpdate(t);}
  pendingId=null;
  document.getElementById('dialog-wrap').classList.remove('show');
  saveLocal();render();buildGF();
}

// ================================================================
// TASK ACTIONS
// ================================================================
async function toggle(id){
  const t=tasks.find(x=>x.id===id); if(!t)return;
  if(!t.done){
    t.done=true; saveLocal();render();buildGF();
    await cloudUpdate(t);
    if(t.repeat){openDialog(id);return;}
  }else{
    t.done=false;
    await cloudUpdate(t);
  }
  saveLocal();render();buildGF();
  setSS("ok",`✓ 更新完了 — ${new Date().toLocaleTimeString("ja-JP")}`);
}

async function del(id){
  if(!confirm('このタスクを削除しますか？'))return;
  tasks=tasks.filter(x=>x.id!==id);
  saveLocal();render();buildGF();
  await cloudDelete(id);
  setSS("ok",`✓ 削除完了 — ${new Date().toLocaleTimeString("ja-JP")}`);
}

function startEdit(id){editId=id;render();const e=document.getElementById('edit-inp');if(e){e.focus();e.setSelectionRange(e.value.length,e.value.length);}}
async function saveEdit(id){
  const e=document.getElementById('edit-inp');
  if(e&&e.value.trim()){const t=tasks.find(x=>x.id===id);if(t){t.title=e.value.trim();await cloudUpdate(t);}}
  editId=null;saveLocal();render();
  setSS("ok",`✓ 更新完了 — ${new Date().toLocaleTimeString("ja-JP")}`);
}
function cancelEdit(){editId=null;render();}

// ================================================================
// GENRE FILTERS
// ================================================================
function buildGF(){
  const el=document.getElementById('genre-filters');
  el.innerHTML=[
    `<button class="fbtn${gf==='all'?' active':''}" data-gf="all"><span class="gdot" style="background:#888780"></span>すべて</button>`,
    ...GENRES.map(g=>{const c=GC[g],cnt=tasks.filter(t=>t.genre===g&&!t.done).length;
      return`<button class="fbtn${gf===g?' active':''}" data-gf="${g}"><span class="gdot" style="background:${c.dot}"></span>${g}${cnt?` <span style="font-size:10px;color:var(--text3)">${cnt}</span>`:''}</button>`;
    })
  ].join('');
  el.querySelectorAll('.fbtn').forEach(b=>b.addEventListener('click',()=>{gf=b.dataset.gf;buildGF();render();}));
}

// ================================================================
// RENDER
// ================================================================
function tHTML(t){
  const c=GC[t.genre]||GC['その他'],ov=isOv(t),ds=fmtD(t.due,t.time);
  const rb=t.repeat?`<span class="rbadge">🔁 ${DAYS[t.repeatDay]}曜</span>`:'';
  const sid=`'${t.id}'`;
  if(editId===t.id)return`<div class="task-item"><div class="gbar" style="background:${c.bar}"></div><button class="check-btn" onclick="toggle(${sid})">${t.done?'✓':''}</button><input class="edit-input" id="edit-inp" value="${t.title.replace(/"/g,'&quot;')}" onkeydown="if(event.key==='Enter')saveEdit(${sid});if(event.key==='Escape')cancelEdit()"><div class="task-actions" style="opacity:1"><button class="act-btn" onclick="saveEdit(${sid})">✓</button><button class="act-btn" onclick="cancelEdit()">✕</button></div></div>`;
  return`<div class="task-item${t.done?' done':''}"><div class="gbar" style="background:${c.bar}"></div><button class="check-btn" onclick="toggle(${sid})">${t.done?'✓':''}</button><div class="task-body"><div class="task-title">${t.title}</div><div class="task-meta"><span class="badge" style="background:${c.bg};color:${c.tx}">${t.genre}</span><span class="badge p-${t.priority}">${PL[t.priority]}</span><span class="badge cost-${t.cost}">コスト：${CL[t.cost]}</span>${rb}${ds?`<span class="due-lbl${ov?' ov':''}">📅 ${ds}${ov?' (期限超過)':''}</span>`:''}</div></div><div class="task-actions"><button class="act-btn" onclick="startEdit(${sid})">✏️</button><button class="act-btn del" onclick="del(${sid})">🗑️</button></div></div>`;
}

function render(){
  const fl=tasks.filter(t=>{
    const g=gf==='all'||t.genre===gf; let s=true;
    if(sf==='todo')s=!t.done; else if(sf==='done')s=t.done;
    else if(sf==='high')s=t.priority==='high'&&!t.done;
    else if(sf==='heavy')s=t.cost==='heavy'&&!t.done;
    else if(sf==='overdue')s=isOv(t); else if(sf==='repeat')s=t.repeat&&!t.done;
    return g&&s;
  });
  document.getElementById('s-all').textContent =tasks.length;
  document.getElementById('s-todo').textContent=tasks.filter(t=>!t.done).length;
  document.getElementById('s-done').textContent=tasks.filter(t=>t.done).length;
  document.getElementById('s-over').textContent=tasks.filter(isOv).length;
  const c=document.getElementById('task-container');
  if(!fl.length){c.innerHTML='<div class="empty"><span class="empty-icon">📋</span>タスクがありません</div>';return;}
  const todo=fl.filter(t=>!t.done),done=fl.filter(t=>t.done);
  c.innerHTML=(todo.length?`<div class="task-list">${todo.map(tHTML).join('')}</div>`:'')+
    (done.length?`<div class="section-title">完了済み (${done.length})</div><div class="task-list">${done.map(tHTML).join('')}</div>`:'');
}

// ================================================================
// INIT
// ================================================================
document.addEventListener('DOMContentLoaded', async () => {
  document.getElementById('add-btn').addEventListener('click',addTask);
  document.getElementById('add-btn-rep').addEventListener('click',addTask);
  document.getElementById('new-task').addEventListener('keydown',e=>{if(e.key==='Enter')addTask();});
  document.querySelectorAll('[data-sf]').forEach(b=>{
    b.addEventListener('click',()=>{sf=b.dataset.sf;document.querySelectorAll('[data-sf]').forEach(x=>x.classList.remove('active'));b.classList.add('active');render();});
  });
  const d=new Date();
  document.getElementById('today-date').textContent=`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
  document.getElementById('ver-badge').textContent=`v${APP_VERSION}`;
  document.getElementById('version-tag').textContent=`v${APP_VERSION} — タスク管理アプリ`;

  loadLocal(); buildGF(); render();

  if(isReady()){
    setSS("loading","クラウドと同期中...");
    await syncFromCloud();
  } else {
    setSS("warn","⚠️ Supabase未設定 — ローカル保存モードで動作中");
  }
});
</script>
</body>
</html>
